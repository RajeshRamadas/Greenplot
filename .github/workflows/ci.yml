name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: greenplot
          POSTGRES_PASSWORD: greenplot
          POSTGRES_DB: greenplot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greenplot" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests && ruff format --check app tests
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          GP_TEST_DATABASE_URL: postgresql+psycopg://greenplot:greenplot@localhost/greenplot_test
      - name: Migrations are complete
        run: alembic upgrade head && alembic check
        env:
          GP_DATABASE_URL: postgresql+psycopg://greenplot:greenplot@localhost/greenplot_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
