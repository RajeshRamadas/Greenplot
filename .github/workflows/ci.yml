name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: greenplot
          POSTGRES_PASSWORD: greenplot
          POSTGRES_DB: greenplot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greenplot" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests && ruff format --check app tests
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          GP_TEST_DATABASE_URL: postgresql+psycopg://greenplot:greenplot@localhost/greenplot_test
      - name: Migrations are complete
        run: alembic upgrade head && alembic check
        env:
          GP_DATABASE_URL: postgresql+psycopg://greenplot:greenplot@localhost/greenplot_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings from the example, with a random key (production refuses the sample one)
        run: |
          cp .env.example .env
          sed -i "s/^GP_SECRET_KEY=.*/GP_SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Health checks
        run: |
          docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health').read().decode())"
          curl -fsS -o /dev/null http://localhost:3000/
          # The web app proxies /api/v1 to the API; an unauthenticated call must reach FastAPI.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/public/demo-requests)" = 401
      - name: Worker's first job pass succeeds
        run: |
          # The worker logs and swallows job errors, so check its output.
          for _ in $(seq 60); do
            logs="$(docker compose logs worker)"
            if grep -q "job run failed" <<<"$logs"; then echo "$logs"; exit 1; fi
            if grep -q "greenplot.worker jobs:" <<<"$logs"; then exit 0; fi
            sleep 1
          done
          echo "worker did not finish a job pass"; exit 1
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
